buildscript {
  ext.getExtOrDefault = {name ->
    return rootProject.ext.has(name) ? rootProject.ext.get(name) : project.properties['RgbLib_' + name]
  }

  repositories {
    google()
    mavenCentral()
  }

  dependencies {
    classpath "com.android.tools.build:gradle:8.7.2"
    // noinspection DifferentKotlinGradleVersion
    classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:${getExtOrDefault('kotlinVersion')}"
  }
}


apply plugin: "com.android.library"
apply plugin: "kotlin-android"

apply plugin: "com.facebook.react"

// rgb-lib (RGB_L1) comes from Maven Central at the version pinned in this package.
def rgbLibManifest = file("../src/bindings/rgb-lib/manifest.json")
if (!rgbLibManifest.isFile()) {
  throw new GradleException("RgbLib: ${rgbLibManifest} is missing; reinstall @utexo/rgb-sdk-rn.")
}
def rgbLibPin = new groovy.json.JsonSlurper().parse(rgbLibManifest)
if (!(rgbLibPin.version instanceof String) || rgbLibPin.version.isEmpty()) {
  throw new GradleException("RgbLib: ${rgbLibManifest} has no rgb-lib version; reinstall @utexo/rgb-sdk-rn.")
}

def getExtOrIntegerDefault(name) {
  return rootProject.ext.has(name) ? rootProject.ext.get(name) : (project.properties["RgbLib_" + name]).toInteger()
}

android {
  namespace "com.utexo.rgblibrn"

  compileSdkVersion getExtOrIntegerDefault("compileSdkVersion")

  defaultConfig {
    minSdkVersion getExtOrIntegerDefault("minSdkVersion")
    targetSdkVersion getExtOrIntegerDefault("targetSdkVersion")
    testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    consumerProguardFiles "consumer-rules.pro"
  }

  buildFeatures {
    buildConfig true
  }

  buildTypes {
    release {
      minifyEnabled false
    }
  }

  lintOptions {
    disable "GradleCompatible"
  }

  compileOptions {
    sourceCompatibility JavaVersion.VERSION_1_8
    targetCompatibility JavaVersion.VERSION_1_8
  }

  sourceSets {
    main {
      java.srcDirs += [
        "generated/java",
        "generated/jni"
      ]
    }
  }
}

repositories {
  mavenCentral()
  google()
}

def kotlin_version = getExtOrDefault("kotlinVersion")

dependencies {
  implementation "com.facebook.react:react-android"
  implementation "org.jetbrains.kotlin:kotlin-stdlib:$kotlin_version"
  // UniFFI-generated Kotlin bindings require JNA. Use Android AAR
  // artifact explicitly to avoid Gradle resolving both .aar and .jar variants.
  implementation "net.java.dev.jna:jna:5.17.0@aar"
  implementation "com.utexo:rgb-lib-bfa-android:${rgbLibPin.version}"
  implementation "org.jetbrains.kotlinx:kotlinx-coroutines-core:1.7.3"
  implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.1"

  testImplementation "junit:junit:4.13.2"

  androidTestImplementation "androidx.test:runner:1.6.2"
  androidTestImplementation "androidx.test.ext:junit:1.2.1"
}
