name: Build and Release

on:
  # Triggered by rgb-lightning-node after a new SDK release
  repository_dispatch:
    types: [rln-release]

  # Manual trigger
  workflow_dispatch:
    inputs:
      rln_version:
        description: 'RLN version to pin (e.g., 0.3.0-beta.2)'
        required: true
        type: string

  # Tag-based release (manual version bump + tag push)
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  build:
    name: Build and Publish
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Resolve RLN version
        id: rln
        shell: bash
        run: |
          if [ "${{ github.event_name }}" == "repository_dispatch" ]; then
            VERSION="${{ github.event.client_payload.version }}"
            echo "version=${VERSION#v}" >> $GITHUB_OUTPUT
            echo "auto=true" >> $GITHUB_OUTPUT
          elif [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            VERSION="${{ inputs.rln_version }}"
            echo "version=${VERSION#v}" >> $GITHUB_OUTPUT
            echo "auto=true" >> $GITHUB_OUTPUT
          else
            echo "auto=false" >> $GITHUB_OUTPUT
          fi

      - name: Update RLN version in download script
        if: steps.rln.outputs.auto == 'true'
        run: |
          RLN_VERSION="${{ steps.rln.outputs.version }}"
          sed -i "s/const VERSION = '[^']*'/const VERSION = '${RLN_VERSION}'/" scripts/download-rln-bindings.js
          echo "Pinned RLN VERSION → ${RLN_VERSION}"

      - name: Bump package prerelease version
        if: steps.rln.outputs.auto == 'true'
        run: npm version prerelease --preid=beta --no-git-tag-version

      - name: Commit and push version bump
        if: steps.rln.outputs.auto == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add scripts/download-rln-bindings.js package.json
          git commit -m "chore: bump RLN bindings to v${{ steps.rln.outputs.version }}"
          git push

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: 'https://registry.npmjs.org/'

      - name: Install dependencies
        run: npm install

      - name: Build
        run: npm run build

      - name: Publish to npm
        uses: JS-DevTools/npm-publish@v3
        with:
          token: ${{ secrets.NPM_TOKEN }}
          access: public

      - name: Get package version
        id: pkg_version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=v$VERSION" >> $GITHUB_OUTPUT

      - name: Create Release
        if: steps.rln.outputs.auto == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.pkg_version.outputs.version }}
          name: Release ${{ steps.pkg_version.outputs.version }}
          body: |
            ## rgb-sdk-rn ${{ steps.pkg_version.outputs.version }}

            React Native SDK for RGB Protocol.

            Built with RGB Lightning Node v${{ steps.rln.outputs.version }}

            ### Installation
            ```bash
            npm install @utexo/rgb-sdk-rn
            ```

            ### Supported Platforms
            - iOS
            - Android
          draft: false
          prerelease: ${{ contains(steps.pkg_version.outputs.version, 'beta') || contains(steps.pkg_version.outputs.version, 'alpha') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
